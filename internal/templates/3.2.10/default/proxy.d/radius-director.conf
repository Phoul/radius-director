#########################################################################
#
# Managed proxy configuration
#
# The following home_server and home_server_pool definitions are
# generated by RADIUS Director.
#
#########################################################################

# Tenant: {{ .Identifier }}

#########################################################################
# Managed home_server definitions
#########################################################################

{{- range .HomeServers }}

home_server {{ .Identifier }} {
        type = coa
        ipaddr = {{ .IPAddress }}
        port = 3799
        secret = {{ .SharedSecret }}
        require_message_authenticator = no
        response_window = 20
        zombie_period = 40
        revive_interval = 120
        status_check = none
        check_interval = 30
        num_answers_to_alive = 3
        coa {
                irt = 2
                mrt = 16
                mrc = 5
                mrd = 30
        }
}

{{- end }}

#########################################################################
# Managed home_server_pool definitions
#########################################################################

home_server_pool concentrators {
{{- range .HomeServers }}
        home_server = {{ .Identifier }}
{{- end }}
}

{{- range .HomeServers }}

home_server_pool {{ .IPAddress }} {
        home_server = {{ .Identifier }}
}

{{- end }}